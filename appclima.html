<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>consulta el clima </title>
    <style>
        body{
            background-color: rgb(0, 217, 255);
        }
        header{
            display: flex;
            justify-content: center;
        }
        .padre{
            padding: 25px;
            border-radius: 10px;
            background-color: rgb(33, 109, 110);
            transition: all .3s linear;
        }
        .padre h1{
            text-align: center;
            font-family: monospace;
            text-transform: capitalize;
            color: aliceblue;
        }
        .padreentrada input{
            outline: 0;
            color: black;
            font-style: italic;
            padding: 5px;
            border-color: transparent;
        }
        .padreentrada button{
            padding: 5px;
            border-color: transparent;
            margin-left: 10px;
            color: rgb(0, 0, 0);
            transition: all .3s linear;
        }
        .datos{
            position: relative;
            display: flex;
            justify-content: center;
            gap: 0px;
            align-items: center;
            flex-direction: column;
        }
        .datos{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: -30px;
        }
        .datos h1{
            font-size: 2.1em;
            color: aliceblue;
            font-family: 'Courier New', Courier, monospace;
        }
        .datos img{
            width: 100px;
        }
        .datos p{
            font-size: 1em;
            font-weight: 100;
            color: aliceblue;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <header>
        <div class="padre">
            <h1>consulta el clima</h1>
            <div class="padreentrada">
                <input type="text" name="ciudad" id="ciudad" placeholder="ciudad o pais">
                <button onclick="buscar()">buscar</button>
            </div>
            <div id="dato" class="datos"></div>
        </div>
    </header>
    <script>
        let restaTemperatura = 273.15
        let api_key = "d1c0210dac225f61732b46f07237baaf"

        function buscar(){
            let ciudad = document.getElementById("ciudad")
            if(ciudad.value.length > 3){
                llamarapi(ciudad)
            }
        }

        async function llamarapi(ciudad) {
            try {
                let api = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${ciudad.value}&appid=${api_key}`)    
                if(!api.ok){
                    throw new Error("algo anda mal con el sevidor");
                }
                let api_lista = await api.json()

                dato(api_lista)

            } catch (error) {
                console.log(error)
            }        
        }

        function dato(api_lista){
            console.log(api_lista)

            let padre = document.getElementById("dato")
            padre.innerHTML = ""

            let nombre = api_lista.name
            let pais = api_lista.sys.country
            let icono = api_lista.weather[0].icon
            let temperatura = api_lista.main.temp
            let humedad = api_lista.main.humidity

            padre.innerHTML = `
            <h1>${nombre},${pais}</h1>
            <img src=https://openweathermap.org/img/wn/${icono}@2x.png> 
            <p>temperatura ${Math.trunc(temperatura - restaTemperatura)}°</p>
            <p>humedad ${humedad}%</p>
            `
        }

    </script>
</body>
</html>
