<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="Of1pjc-MzGvIkhPn_Qgse9ODxSiFtH1DZqVBw2Rf2VQ" />
  <title>App del Clima</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="weather-card">
    <div class="city-input">
      <input type="text" placeholder="Escribe una ciudad..." id="ciudad" />
      <button onclick="mostrar()">Buscar</button>
    </div>
    <div class="weather-header">
      <h1 id="pais"></h1>
      <p id="fecha">Miércoles, 19 Nov</p>
    </div>
    <div class="weather-info">
      <img id="imagen" src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" alt="Soleado" class="weather-icon" />
      <h2 id="temperatura">10°C</h2>
 
    </div>
    <div class="weather-footer">
      <div id="padre">
        <p id="temperatura-maxima">🌡️ Máx: 30°C</p>
        <p id="temperatura-minima">❄️ Mín: 22°C</p>
        <p id="humedad">💧 Humedad: 60%</p>
      </div>
   
    </div>
  </div>
